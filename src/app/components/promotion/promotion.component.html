<section class="promotion-section">
  <div class="promotion-container">
    <div class="promo-image-wrapper">
      <!-- Imagem acessada a partir do root (pasta public) -->
      <img src="/WhatsApp Image 2026-07-23 at 16.37.40.jpeg" alt="Promoção Alemão Tabacaria" class="promo-img" onerror="this.src='favicon.ico'; this.classList.add('fallback-img')">
      <div class="scan-overlay">
        <div class="scan-line"></div>
      </div>
    </div>
    
    <div class="promo-content">
      <div class="coupon-card">
        <div class="coupon-icon">🎟️</div>
        <h3>Resgatou um código?</h3>
        <p>Insira seu código promocional abaixo e garanta seu desconto no próximo pedido!</p>
        
        <div class="coupon-input-group">
          <input 
            type="text" 
            [(ngModel)]="couponCode" 
            placeholder="Digite seu cupom" 
            maxlength="20"
            (keyup.enter)="applyCoupon()"
          >
          <button (click)="applyCoupon()">Aplicar</button>
        </div>
        
        <div class="coupon-feedback" *ngIf="feedbackMessage" [ngClass]="feedbackType">
          <span class="icon">
            {{ feedbackType === 'success' ? '✅' : (feedbackType === 'error' ? '❌' : '⚠️') }}
          </span>
          <span class="text">{{ feedbackMessage }}</span>
        </div>
        
        <div class="success-discount-area" *ngIf="feedbackType === 'success'">
          <div class="discount-badge">
            <span class="label">Desconto Ganho:</span>
            <span class="value">{{ discountApplied }}</span>
          </div>
          <button class="whatsapp-btn" (click)="openWhatsApp()">
            Fazer Pedido no WhatsApp
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
